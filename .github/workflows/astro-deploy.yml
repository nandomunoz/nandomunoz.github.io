# nandomunoz.com (Astro) → GitHub Pages (plan Phase 11, D2 = GitHub Pages).
# It publishes from `main` only (the github-pages environment allows the default branch) or by hand from the Actions tab.
# THE SAME GATE AS astro-build.yml, plus the placeholders now FAIL: nothing is published with a ⟦…⟧ left or a broken link.
# Before the first run: Settings → Pages → Source = "GitHub Actions", Custom domain = nandomunoz.com, Enforce HTTPS.
# That switch stops GitHub serving the old site from the branch: do it when `feature/astro` is merged into `main` (plan D1).
name: astro-deploy
on:
  push:
    branches: [main]
    paths: ['astro/**', '.github/workflows/astro-deploy.yml']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: astro } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: astro/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:content
      - run: npm run check:links
      - run: npm run budgets
      - run: npm run redirects
      - run: npm run seo
      - run: npm run check:placeholders          # no --warn: fails on any ⟦…⟧
      - run: npx playwright-core install --with-deps chromium
      - run: npm run audit
      - uses: actions/upload-pages-artifact@v3
        with: { path: astro/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
