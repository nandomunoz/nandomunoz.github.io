# The same check as the pre-commit hook, for pushes that skipped it: the built
# pages and the cassette's voice clips must match the texts. It needs no voice
# installed (it only hashes the texts and looks for the files).
name: check
on: [push, pull_request]
permissions: { contents: read }
jobs:
  build-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node build.mjs --check
