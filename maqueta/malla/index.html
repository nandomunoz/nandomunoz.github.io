<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malla · Fernando Muñoz</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <meta name="view-transition" content="same-origin">
  <link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <a class="skip" href="#obras">Saltar a las obras</a>

  <!-- The sheet: a hand-drawn grid that folds like cloth. Decorative. -->
  <canvas id="sheet" aria-hidden="true"></canvas>

  <nav class="bar" aria-label="Secciones" hidden></nav>

  <main id="main" aria-busy="true"></main>

  <p class="gauge" aria-hidden="true"><span class="gauge__lab"></span><span class="gauge__val">0.00</span><span class="gauge__bar"><i></i></span></p>

  <dialog id="page" aria-labelledby="page-title"></dialog>

  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
  </svg>
</body>
</html>
