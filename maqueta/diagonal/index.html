<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#963641">
  <title>Diagonal · Fernando Muñoz</title>
  <link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <a class="skip" href="#obras" data-t="skip">Saltar al contenido</a>

  <!-- the name, once the hero is gone, relocates into this corner sash -->
  <a class="sash" href="#top" aria-label="Volver arriba" data-t-aria="top"><span data-slot="nick">Nando</span></a>
  <a class="lang" href="?lang=en" hreflang="en" lang="en">EN</a>

  <main id="top">
    <header class="hero" aria-labelledby="hero-name">
      <h1 id="hero-name" class="sr-only" data-slot="name">Fernando Muñoz</h1>
      <div class="weave" aria-hidden="true"><div class="plane"></div></div>
      <p class="hero-foot">
        <span data-slot="kicker"></span>
        <span class="cue" aria-hidden="true"></span>
      </p>
    </header>

    <div class="air"></div>

    <section class="about" aria-labelledby="about-title">
      <div class="deck" aria-hidden="true"></div>
      <div class="about-text">
        <h2 id="about-title" class="tag" data-t="about">Sobre mí</h2>
        <p class="deck-sr sr-only" data-slot="deck"></p>
        <div class="bio" data-slot="bio"></div>
      </div>
      <span class="lone lone-a" aria-hidden="true"></span>
      <span class="lone lone-b" aria-hidden="true"></span>
    </section>

    <div class="seam" aria-hidden="true"></div>

    <section class="works" id="obras" aria-labelledby="works-title" tabindex="-1">
      <div class="works-head">
        <h2 id="works-title" class="cross"><span data-t="works">Obras</span> <b data-slot="count"></b></h2>
        <p class="works-note" data-t="worksNote"></p>
      </div>
      <ol class="stack" data-slot="projects"></ol>
    </section>

    <div class="air air-lg"></div>

    <section class="contact" aria-labelledby="contact-title">
      <div class="contact-text">
        <h2 id="contact-title" data-slot="contactTitle"></h2>
        <p data-slot="contactText"></p>
      </div>
      <ul class="socials" data-slot="socials"></ul>
      <footer class="colophon">
        <span data-slot="name"></span> · <span data-slot="kickerFoot"></span>
        <span class="colo-note" data-t="colophon"></span>
      </footer>
    </section>
  </main>

  <!-- the project page: a bar that swung to horizontal -->
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-scroll">
      <div class="sheet-bar">
        <span class="sheet-no" data-sheet="no"></span>
        <h2 id="sheet-title" class="sheet-title" data-sheet="name" tabindex="-1"></h2>
        <span class="sheet-year" data-sheet="year"></span>
      </div>
      <div class="sheet-body">
        <aside class="sheet-meta">
          <p class="tag tag-inv" data-sheet="kicker"></p>
          <h3 class="meta-h" data-t="tech">Técnica</h3>
          <ul class="chips" data-sheet="tech"></ul>
          <div class="sheet-links" data-sheet="links"></div>
        </aside>
        <div class="sheet-text" data-sheet="body"></div>
      </div>
      <nav class="sheet-nav" aria-label="Proyectos" data-t-aria="projectsNav">
        <a class="sn sn-prev" data-sheet="prev" href="#"></a>
        <a class="sn sn-next" data-sheet="next" href="#"></a>
      </nav>
      <div class="sheet-lattice" aria-hidden="true"></div>
    </div>
    <a class="sheet-close" href="#obras"><span data-t="close">Cerrar</span><i aria-hidden="true"></i></a>
  </div>
</body>
</html>
